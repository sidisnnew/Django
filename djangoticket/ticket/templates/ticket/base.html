<!DOCTYPE html>
<html>
<head>
    {% block head %}
    {% endblock %}
    <style>
        .title{
            background-color: aquamarine;
        }
    </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ticket System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <div class="container-fluid bg-primary" style="display: flex; justify-content: space-between;">
        <span>
            <a class="text-white" href="/ticket">Home</a>
            <a class="text-white" href="/about">About</a>
        </span>
        <span>
            {% if user.is_authenticated %}
            <a class="text-white" href="/ticket/logout">Logout</a>
            {% endif %}
        </span>
    </div>
    <br>
    <div class="container-fluid">
        {% block body %} {% endblock %}
    </div>
</body>
</html>
