{% extends "ticket/base.html" %}
{% block title %}
Home
{% endblock %}
{% block body %}
<h2 class="title">概覽</h2>
<div class="container-fluid">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-4">
            <a href="/ticket/tickets/" class="d-block border p-3 text-center">
                待辦清單
                <br>
                <h3>({{ticket_number}})</h3>
            </a>
        </div>
        <div class="col-4">
            <a href="/ticket/all/" class="d-block border p-3 text-center">
                全部清單
                <br>
                <h3>({{all_ticket_number}})</h3>
            </a>
        </div>
        <div class="col-2"></div>
    </div>
    {% if user.is_staff %}
        <br>
        <div class="row justify-content-center">
            <div class="col-4">
                <a href="/ticket/add/" class="d-block border p-3 text-center">新增服務單</a>
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
