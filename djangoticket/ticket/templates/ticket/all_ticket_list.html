{% extends "ticket/base.html" %}
{% block title %}
All Tickets
{% endblock %}
{% block body %}
<h2>All tickets</h2>
{% if all_ticket_list%}
    <ul>
        {% for ticket in all_ticket_list %}
        <li><a href="/ticket/{{ticket.id}}">{{ticket.t_title}}</a></li>
        {% endfor %}
    </ul>
{% else %}
    <p>No ticket</p>
{% endif %}
{% endblock %}
