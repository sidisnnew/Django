{% extends "ticket/base.html" %}
{% block title %}
All Tickets
{% endblock %}
{% block body %}
<h2>All tickets</h2>
<form method="get" action="{% url 'ticket:all' %}">
    <label for="from">From: </label>
    <input type="date" id="from" name="from">
    <label for="to">To: </label>
    <input type="date" id="to" name="to">
    <input type="submit" value="Search">
</form>
<div class="mt-3">
    {% if all_ticket_list %}
        <ol>
            {% for ticket in all_ticket_list %}
            <li><a href="/ticket/{{ticket.id}}">{{ticket.t_title}}</a></li>
            {% endfor %}
        </ol>
    {% else %}
        <p>No ticket</p>
    {% endif %}
    {% endblock %}
</div>
