{% extends "ticket/base.html" %}
{% block title %}
Ticket List
{% endblock %}
{% block body %}
<h2>To do list</h2>
{% if ticket_list%}
    <ul>
        {% for ticket in ticket_list %}
        <li><a href="/ticket/{{ticket.id}}">{{ticket.t_title}}</a></li>
        {% endfor %}
    </ul>
{% else %}
    <p>No ticket left</p>
{% endif %}
{% endblock %}
