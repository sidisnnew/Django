{% extends "ticket/base.html" %}
{% block title %}
ADD NEW TICKET
{% endblock %}
{% block body %}
<div class="container-fluid">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label class="form-label">Title<span class="text-danger">*</span></label>
        <br>
        <input class="form-control" type="text" id="title" name="title" required>
        <br>
        <label for="content">Content<span class="text-danger">*</span></label><br>
        <textarea class="form-control" rows="10" type="text" id="content" name=content required></textarea>
        <br>
        <label>Warranty: </label>
        <label for="yes">Yes</label>
        <input type="radio" id="yes" name="warranty" value="True" checked>
        <label for="no">No</label>
        <input type="radio" id="no" name="warranty" value="False">
        <br>
        <input type="file" class="mt-2" name="image" accept="image/*">
        <br>
        <button type="submit" class="btn-primary mt-2">Submit</button>
    </form>
</div>
{% endblock %}
